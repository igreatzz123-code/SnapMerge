name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk SnapMerge.apk
      - uses: actions/upload-artifact@v4
        with: { name: SnapMerge-APK, path: SnapMerge.apk }
      - name: Publish APK as a release (easy download from the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SnapMerge APK
          body: "حمّل SnapMerge.apk وثبّته على الأندرويد."
          files: SnapMerge.apk
          make_latest: true
